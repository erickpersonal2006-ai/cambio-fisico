<title>Cambio Físico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>/* Layout: app de una columna (máx 560px). Cabecera con saludo, racha y tira semanal; 4 pestañas fijas abajo; fichas en hoja inferior. Oscuro primero. */
:root{
  --bg:#0E1014; --surface:#171A20; --surface2:#20242C; --line:#2A2F39;
  --fg:#F2F3F6; --muted:#949BA8;
  --ej:#8592FF; --run:#FF7A3D; --food:#38D38A; --streak:#FFB020; --bad:#FF5C6C;
  --acc:var(--ej);
  --fig:var(--acc); --fig2:color-mix(in srgb,var(--acc) 45%,var(--surface2)); --fig-bg:var(--surface2);
  --fig-prop:#6B7280; --fig-prop2:#3A404C; --fig-band:var(--run); --fig-pack:#4B5263;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#ECEEF3; --line:#DFE2E9; --fg:#15171C; --muted:#5D6472;
  --ej:#4B5BE0; --run:#E2591A; --food:#119A5C; --streak:#D98A00; --bad:#D93445;
  --fig-prop:#9097A3; --fig-prop2:#D5D9E0; --fig-pack:#2B2F3A; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#ECEEF3; --line:#DFE2E9; --fg:#15171C; --muted:#5D6472;
  --ej:#4B5BE0; --run:#E2591A; --food:#119A5C; --streak:#D98A00; --bad:#D93445;
  --fig-prop:#9097A3; --fig-prop2:#D5D9E0; --fig-pack:#2B2F3A; color-scheme:light;
}
body[data-tab="run"]{--acc:var(--run)} body[data-tab="food"]{--acc:var(--food)} body[data-tab="prog"]{--acc:var(--streak)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
button:active{transform:scale(.97)}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Cabecera */
header{display:flex;flex-direction:column;gap:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:none}
.brand .mk svg{width:100%;height:100%;display:block}
.brand .hi{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.streak{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;flex:none}
.streak svg{width:20px;height:20px;flex:none}
.streak b{font-family:var(--display);font-size:24px;line-height:1;font-weight:800}
.streak span{font-size:10px;color:var(--muted);line-height:1.1}
.streak.hot svg{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
.gear{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.gear svg{width:18px;height:18px;stroke:var(--muted)}
.phase{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.phase b{color:var(--fg);font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ej),var(--run),var(--food))}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .lbl{font-size:13px;font-weight:600;text-align:center}
.weeknav .lbl em{font-style:normal;color:var(--muted);font-weight:500}
.arrow{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.arrow svg{width:16px;height:16px;stroke:var(--fg)}
.arrow:disabled{opacity:.3}
.todayb{font-size:12px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:999px;padding:4px 10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border-radius:14px;background:var(--surface);border:1px solid transparent;min-width:0}
.day .dl{font-size:11px;color:var(--muted);font-weight:600}
.day .dn{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.day .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line)}
.day .dot svg{width:11px;height:11px;stroke:#14110A}
.day.done .dot{background:var(--streak);border:0}
.day.rest .dot{border:1.5px solid var(--line);background:var(--surface2)}
.day.miss .dot{border:1.5px solid var(--bad)}
.day.today .dn{color:var(--acc)}
.day.sel{border-color:var(--acc);background:var(--surface2)}
.day.out{opacity:.35}

/* Hero */
.hero{border-radius:22px;padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 0 auto auto;width:180px;height:180px;border-radius:50%;background:var(--acc);opacity:.10;transform:translate(40%,-40%);pointer-events:none}
.tag{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:999px;padding:4px 10px}
.hero h2{font-family:var(--display);font-size:34px;line-height:.98;font-weight:800;margin:0;text-transform:uppercase;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero p b{color:var(--fg)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;background:var(--acc);color:#0B0C10;font-weight:700;font-size:16px}
.cta svg{width:20px;height:20px;stroke:currentColor}
.cta.on{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.cta.on svg{stroke:var(--food)}
.cta.ghost{background:var(--surface2);color:var(--fg)}
section h3{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
section h3 small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:10px}
.prog-ring{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}

/* Ejercicio */
.ex{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.ex .ph{width:96px;height:68px;border-radius:12px;overflow:hidden;background:var(--surface2)}
.ex .ph svg{width:100%;height:100%;display:block}
.ex .nm{font-weight:600;font-size:15px;line-height:1.25}
.ex .mt{font-size:13px;color:var(--muted);margin-top:3px}
.ex .mt b{color:var(--fg);font-weight:600}
.ex .sets{display:flex;gap:3px;margin-top:6px}
.ex .sets i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.ex .sets i.on{background:var(--acc)}
.chev{width:16px;height:16px;stroke:var(--muted)}
.ex.full{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.up{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#14110A;background:var(--streak);border-radius:999px;padding:2px 8px;margin-top:6px;align-self:flex-start}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.plain li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.plain li:last-child{border:0}
.plain ul,.plain ol{list-style:none;margin:0;padding:0}
.plain li a{font-weight:600;text-decoration:none}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:14px;padding:12px 14px}
.note b{color:var(--fg)}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--streak) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--streak) 45%,transparent)}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner.g{background:color-mix(in srgb,var(--food) 14%,var(--surface));border-color:color-mix(in srgb,var(--food) 45%,transparent)}

/* Running */
.runhero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.big .v{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;white-space:nowrap}
.big .v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.big .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.segbar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.segbar div{min-width:3px}
.seg-suave{background:color-mix(in srgb,var(--run) 45%,var(--surface2))}
.seg-rapido{background:var(--run)}
.seg-trote{background:color-mix(in srgb,var(--run) 22%,var(--surface2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.step{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;background:color-mix(in srgb,var(--run) 16%,transparent);color:var(--run)}
.step .t{font-weight:600}
.step .d{font-size:13px;color:var(--muted)}
.step .r{font-family:var(--display);font-size:20px;font-weight:700;text-align:right}
.weektable{width:100%;border-collapse:collapse;font-size:13px}
.weektable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.weektable td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.weektable tr.cur td{color:var(--acc);font-weight:600}
.tscroll{overflow-x:auto}
.runtimer{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:8px 0}
.runtimer .clock{font-family:var(--display);font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.runtimer .ph2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--run)}

/* Comida */
.rings{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.ring .c span{font-size:11px;color:var(--muted)}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.macro .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.macro .row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .5s}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.meal .hd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.meal .time{font-family:var(--display);font-size:15px;font-weight:700;color:var(--muted);width:44px}
.meal .ttl{font-weight:600;line-height:1.25}
.meal .kc{font-size:12px;color:var(--muted);margin-top:2px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.check svg{width:15px;height:15px;stroke:transparent}
.check.on{background:var(--acc);border-color:var(--acc)}
.check.on svg{stroke:#0B0C10}
.check.big{width:44px;height:44px}
.check.big svg{width:20px;height:20px}
.meal .bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.ing{width:100%;border-collapse:collapse;font-size:14px}
.ing td{padding:7px 0;border-bottom:1px dashed var(--line)}
.ing td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-left:10px}
.ing th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding-bottom:4px}
.ing th:last-child{text-align:right}
.prep{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;background:var(--surface2);border-radius:999px;padding:4px 10px;color:var(--muted)}
.chip.a{color:var(--acc)}
.toggle{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.toggle button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;color:var(--muted)}
.toggle button.on{background:var(--surface);color:var(--fg)}
.rowbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.rowbtn span:last-child{color:var(--muted);font-weight:500;font-size:13px}
.shop li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.shop li.on .nm{text-decoration:line-through;color:var(--muted)}
.shop .check{width:26px;height:26px}
.shop .pr{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.shop .q{font-size:12px;color:var(--muted)}

/* Series */
.setrows{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.setrow.on{border-color:var(--acc)}
.setrow .sl{font-weight:600;font-size:14px}
.setrow .sl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:12px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:10px;font-size:20px;font-weight:600;display:grid;place-items:center}
.stepper output{min-width:38px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.timer .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--acc) 14%,transparent);transform-origin:left;transform:scaleX(0)}
.timer>*{position:relative}
.timer .tv{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* Progreso */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:600}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.tg{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--acc)}
.tg.on::after{transform:translateX(20px)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea,select.inp,input.inp{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-125%)}
.chart .empty{font-size:13px;color:var(--muted);padding:18px 0;text-align:center}
.mtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.mtable input{width:64px;font:inherit;font-size:16px;text-align:right;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.pos{color:var(--food);font-weight:600} .neg{color:var(--bad);font-weight:600}
.x{color:var(--muted);font-size:20px;line-height:1;padding:0 6px}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor}
nav.tabs button[data-t="ej"].on{color:var(--ej)} nav.tabs button[data-t="run"].on{color:var(--run)} nav.tabs button[data-t="food"].on{color:var(--food)} nav.tabs button[data-t="prog"].on{color:var(--streak)}
nav.tabs .pip{width:5px;height:5px;border-radius:50%;background:transparent}
nav.tabs button.ok .pip{background:var(--streak)}
main{animation:fade .25s ease}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet.drag{transition:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px;flex:none}
.grabzone{padding:6px 0 4px;margin:-8px 0 -8px;touch-action:none;cursor:grab}
.sheet h2{font-family:var(--display);font-size:32px;font-weight:800;text-transform:uppercase;line-height:1;margin:0;text-wrap:balance}
.sheethead{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.back svg{width:16px;height:16px;stroke:var(--fg)}
.anim{aspect-ratio:10/7;border-radius:20px;overflow:hidden;background:var(--surface2);max-width:100%}
.anim svg{width:100%;height:100%;display:block}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.btn{padding:11px 16px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--acc);color:#0B0C10}
.btn.danger{color:var(--bad)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button,.menu a{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;text-decoration:none;color:var(--fg);width:100%}
.menu>*:last-child{border-bottom:0}
.menu .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--surface2)}
.menu .t{font-weight:600}
.menu .d{font-size:12px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--food);flex:none}
.edrow{display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.edrow .r3{display:grid;grid-template-columns:70px 1fr 90px;gap:8px}
.edrow .acts{display:flex;gap:6px;justify-content:flex-end}
.edrow .acts button{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:15px}
.edrow select,.edrow input{font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);width:100%;min-width:0}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--acc);font-weight:700;filter:brightness(.8)}
canvas.fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}

/* Bienvenida */
.ob{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ob .in{max-width:480px;width:100%;margin:auto;display:flex;flex-direction:column;gap:20px}
.ob .logo{width:96px;height:96px;border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ob .logo svg{width:100%;height:100%;display:block}
.ob h1{font-family:var(--display);font-size:46px;line-height:.95;font-weight:800;text-transform:uppercase;margin:0}
.ob p{margin:0;color:var(--muted);font-size:16px}
.ob .dots{display:flex;gap:6px}
.ob .dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s}
.ob .dots i.on{width:22px;background:var(--acc)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pillars div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pillars b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.pillars span{font-size:12px;color:var(--muted)}
.pillars i{width:24px;height:6px;border-radius:3px}

/* Resumen semanal */
.recap{display:flex;flex-direction:column;gap:14px}
.recap .score{font-family:var(--display);font-size:84px;font-weight:800;line-height:.9;background:linear-gradient(90deg,var(--ej),var(--run),var(--food));-webkit-background-clip:text;background-clip:text;color:transparent}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayrow div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
.dayrow i{width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.dayrow i.done{background:var(--streak)}
.dayrow i.rest{background:var(--surface);border:1px solid var(--line)}
.dayrow i.miss{border:1.5px solid var(--bad)}
.dayrow i svg{width:14px;height:14px;stroke:#14110A}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>/* Motor de ilustraciones: figura articulada con cinemática inversa.
   Cada ejercicio = 2 poses (A y B). Se interpolan y se recalculan codos y rodillas. */
const FIG = (() => {
  const LEN = {torso:40, uArm:22, fArm:21, thigh:27, shin:27, head:12};
  const F = 124; // suelo
  const rad = d => d*Math.PI/180;
  const dir = (a,l) => [Math.cos(rad(a))*l, Math.sin(rad(a))*l];
  const add = (p,v) => [p[0]+v[0], p[1]+v[1]];
  // IK de 2 huesos. s = +1/-1 elige el lado del codo/rodilla
  function ik(root, target, l1, l2, s){
    let dx=target[0]-root[0], dy=target[1]-root[1], d=Math.hypot(dx,dy)||0.001;
    const max=l1+l2-0.01; if(d>max){dx*=max/d; dy*=max/d; d=max;}
    const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
    const mx=root[0]+dx*a/d, my=root[1]+dy*a/d;
    const j=[mx - s*h*dy/d, my + s*h*dx/d];
    return [j,[root[0]+dx,root[1]+dy]];
  }
  const lerp=(a,b,t)=>a+(b-a)*t;
  const lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
  function mix(A,B,t){
    const o={};
    for(const k in A){ const a=A[k], b=B[k]===undefined?a:B[k];
      o[k]=Array.isArray(a)?lp(a,b,t):typeof a==="number"?lerp(a,b,t):a; }
    return o;
  }
  // Construye articulaciones desde una pose
  function solve(p){
    const hip=p.hip, neck=add(hip,dir(p.torso,LEN.torso));
    const head=add(neck,dir(p.torso+(p.nod||0),LEN.head));
    const sw=p.front?11:0, hw=p.front?7:0;
    const shN=[neck[0]+sw,neck[1]+2], shF=[neck[0]-sw,neck[1]+2];
    const hpN=[hip[0]+hw,hip[1]], hpF=[hip[0]-hw,hip[1]];
    const handF=p.handF||[p.hand[0]-(p.front?0:3),p.hand[1]-(p.front?0:1)];
    const footF=p.footF||[p.foot[0]-(p.front?0:3),p.foot[1]];
    const [eN,hN]=ik(shN,p.hand,LEN.uArm,LEN.fArm,p.eb||1);
    const [eF,hF]=ik(shF,handF,LEN.uArm,LEN.fArm,p.ebF||p.eb||1);
    const [kN,fN]=ik(hpN,p.foot,LEN.thigh,LEN.shin,p.kb||1);
    const [kF,fF]=ik(hpF,footF,LEN.thigh,LEN.shin,p.kbF||p.kb||1);
    return {hip,neck,head,shN,shF,hpN,hpF,eN,hN,eF,hF,kN,fN,kF,fF};
  }
  const seg=(a,b,w,c)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  function props(list,j){
    let s="";
    (list||[]).forEach(pr=>{
      const [t,...a]=pr;
      if(t==="floor") s+=`<line x1="-200" y1="${F+5}" x2="400" y2="${F+5}" stroke="var(--fig-prop)" stroke-width="2" stroke-linecap="round"/>`;
      if(t==="box") s+=`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${F+5-a[1]}" rx="4" fill="var(--fig-prop2)"/>`;
      if(t==="bar") s+=`<line x1="${a[0]}" y1="${a[2]}" x2="${a[1]}" y2="${a[2]}" stroke="var(--fig-prop)" stroke-width="4" stroke-linecap="round"/><line x1="${a[0]+4}" y1="${a[2]}" x2="${a[0]+4}" y2="${a[3]||140}" stroke="var(--fig-prop2)" stroke-width="3"/><line x1="${a[1]-4}" y1="${a[2]}" x2="${a[1]-4}" y2="${a[3]||140}" stroke="var(--fig-prop2)" stroke-width="3"/>`;
      if(t==="wall") s+=`<rect x="${a[0]}" y="4" width="8" height="${F+1}" rx="3" fill="var(--fig-prop2)"/>`;
      if(t==="band"){ // banda: de un punto del cuerpo a un ancla fija o a otro punto
        const p1=j[a[0]], p2=typeof a[1]==="string"?j[a[1]]:a[1];
        s+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q ${((p1[0]+p2[0])/2).toFixed(1)} ${((p1[1]+p2[1])/2+3).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" stroke="var(--fig-band)" stroke-width="2.5" fill="none" stroke-linecap="round"/>`; }
      if(t==="anchor") s+=`<rect x="${a[0]-3}" y="${a[1]-8}" width="6" height="16" rx="2" fill="var(--fig-prop)"/>`;
    });
    return s;
  }
  function pack(j){ // mochila en la espalda
    const n=j.neck,h=j.hip, mx=(n[0]+h[0])/2, my=(n[1]+h[1])/2;
    const ang=Math.atan2(n[1]-h[1],n[0]-h[0])*180/Math.PI;
    return `<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${(ang+90).toFixed(1)})"><rect x="-26" y="-13" width="17" height="27" rx="5" fill="var(--fig-pack)"/></g>`;
  }
  function svgPose(ex,t,opt){
    const p=mix(ex.A,ex.B,t), j=solve(p), C="var(--fig)", C2="var(--fig2)";
    let s=props(ex.props,j);
    // lado lejano
    s+=seg(j.hpF,j.kF,9,C2)+seg(j.kF,j.fF,8,C2)+seg(j.shF,j.eF,8,C2)+seg(j.eF,j.hF,7,C2);
    if(ex.pack) s+=pack(j);
    // tronco y cabeza
    if(p.front){ s+=`<path d="M${j.shF[0]} ${j.shF[1]} L${j.shN[0]} ${j.shN[1]} L${j.hpN[0]} ${j.hpN[1]} L${j.hpF[0]} ${j.hpF[1]} Z" fill="${C}" stroke="${C}" stroke-width="8" stroke-linejoin="round"/>`; }
    else s+=seg(j.hip,j.neck,14,C);
    s+=`<circle cx="${j.head[0].toFixed(1)}" cy="${j.head[1].toFixed(1)}" r="8.5" fill="${C}"/>`;
    // lado cercano
    const O="var(--fig-bg)";
    s+=seg(j.hpN,j.kN,13,O)+seg(j.kN,j.fN,12,O)+seg(j.hpN,j.kN,9.5,C)+seg(j.kN,j.fN,8.5,C);
    s+=seg(j.shN,j.eN,12,O)+seg(j.eN,j.hN,11,O)+seg(j.shN,j.eN,8.5,C)+seg(j.eN,j.hN,7.5,C);
    (ex.bands||[]).forEach(b=>{s+=props([["band",...b]],j);});
    return s;
  }
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  // Encuadre automático: caja que contiene todo el movimiento, en proporción 10:7
  function fit(ex){
    if(ex._vb) return ex._vb;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const P=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
    for(const t of [0,.25,.5,.75,1]){const j=solve(mix(ex.A,ex.B,t)); for(const k in j){const p=j[k]; P(p[0],p[1]);} }
    x0-=12;x1+=12;y0-=14;y1+=8;
    (ex.props||[]).forEach(([t,...a])=>{ if(t==="floor") y1=Math.max(y1,F+8); if(t==="box"){P(a[0],a[1]);P(a[0]+a[2],F+5);} if(t==="bar"){y0=Math.min(y0,a[2]-6);} if(t==="anchor"){P(a[0]-6,a[1]);P(a[0]+6,a[1]);} if(t==="wall") x1=Math.max(x1,a[0]+12); });
    (ex.bands||[]).forEach(b=>{ if(Array.isArray(b[1])) P(b[1][0],b[1][1]); });
    let w=x1-x0,h=y1-y0; const R=10/7;
    if(w/h<R){const nw=h*R; x0-=(nw-w)/2; w=nw;} else {const nh=w/R; y0-=(nh-h)*0.6; h=nh;}
    if(w<130){const s=130/w, cx=x0+w/2, by=y0+h; w*=s; h*=s; x0=cx-w/2; y0=by-h;}
    return ex._vb=`${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
  }
  function svg(ex,t){return `<svg viewBox="${fit(ex)}" class="fig" aria-hidden="true">${svgPose(ex,t)}</svg>`;}
  // Animación en un contenedor
  function play(el,ex){
    let raf, t0=performance.now(); const dur=ex.dur||[1100,1100], hold=350;
    const cyc=dur[0]+dur[1]+hold*2;
    const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
    function frame(now){
      const e=(now-t0)%cyc; let t;
      if(e<dur[0]) t=ease(e/dur[0]); else if(e<dur[0]+hold) t=1; else if(e<dur[0]+hold+dur[1]) t=1-ease((e-dur[0]-hold)/dur[1]); else t=0;
      el.innerHTML=svg(ex,t); raf=requestAnimationFrame(frame);
    }
    if(red){ el.innerHTML=svg(ex,1); return ()=>{}; }
    raf=requestAnimationFrame(frame); return ()=>cancelAnimationFrame(raf);
  }
  const fl=["floor"];
  // ---------- POSES (mirando a la derecha, suelo y=124) ----------
  const P = {
    flexiones:{props:[fl],A:{hip:[88,100],torso:-27,hand:[126,124],foot:[40,124],eb:-1,kb:1},B:{hip:[90,112],torso:-8,hand:[126,124],foot:[40,124]}},
    flexPies:{props:[fl,["box",14,102,36]],A:{hip:[84,96],torso:-20,hand:[124,124],foot:[34,102],eb:-1,kb:1},B:{hip:[88,106],torso:0,hand:[124,124],foot:[34,102]}},
    diamante:{props:[fl],A:{hip:[88,100],torso:-27,hand:[122,124],foot:[40,124],eb:-1,kb:1},B:{hip:[90,112],torso:-8,hand:[122,124],foot:[40,124]}},
    pica:{props:[fl],A:{hip:[92,76],torso:8,hand:[138,124],foot:[64,124],eb:-1,kb:-1,nod:30},B:{hip:[96,80],torso:34,hand:[138,124],foot:[64,124],nod:20}},
    sentadilla:{pack:true,props:[fl],A:{hip:[96,70],torso:-90,hand:[104,46],foot:[100,124],eb:1,kb:1},B:{hip:[78,96],torso:-58,hand:[112,66],foot:[100,124]}},

const fmtPace = p => Math.floor(p)+":"+String(Math.round((p%1)*60)).padStart(2,"0");
function intervals(warm,reps,fast,slow){const s=[{t:warm,k:"suave"}];for(let i=0;i<reps;i++){s.push({t:fast,k:"rapido"});s.push({t:slow,k:"trote"});}return s;}
const WED = [20,25,30,20,30,35,40,25,40,45,45,"test"];
function thuRun(w){
  if(w<=3) return [{t:15,k:"suave"}];
  if(w===4||w===8||w===12) return [{t:10,k:"suave"}];
  if(w===5||w===6) return intervals(5,6,1,1);
  if(w===7||w===9) return intervals(5,8,1,1);
  if(w===10) return intervals(5,5,2,1);
  return intervals(5,6,2,1);
}

  return null;
}
function runStats(r){
  if(r.test) return {min:"≈30",km:"5,0",pace:"6:00",kmN:5};

}

const LSK = "cambio-fisico-v1";
const DEF = () => ({v:2,start:key(today()),name:"",onboarded:false,log:{},best:0,updated:0,m4:{},meas:{},tests:{w1:{},w12:{}},adj:[],shop:{},plan:{sess:{},menu:{}},recap:{},voice:true});
function migrate(s){
  s=Object.assign(DEF(),s||{});
  s.plan=Object.assign({sess:{},menu:{}},s.plan||{}); s.tests=Object.assign({w1:{},w12:{}},s.tests||{});
  // v1: repeticiones por índice → por ejercicio
  for(const k in s.log){const l=s.log[k]; if(!l||!l.reps) continue;
    const ks=Object.keys(l.reps); if(!ks.some(x=>/^\d+$/.test(x))) continue;
    const code=DAYSESS[parse(k).getDay()], items=SESS[code]?SESS[code].items:[], o={};
    ks.forEach(x=>{ if(/^\d+$/.test(x)){ const it=items[+x]; if(it) o[it[0]]=l.reps[x]; } else o[x]=l.reps[x]; });
    l.reps=o; delete l.s;}
  s.v=2; return s;
}
let S = DEF();

const getSess = code => (S.plan.sess&&S.plan.sess[code]) || (SESS[code]?SESS[code].items:[]);
const getMenu = dow => Object.assign({}, MENU[dow], (S.plan.menu||{})[dow]||{});
const startSun = () => {const s=parse(S.start);return addD(s,-s.getDay());};
const weekOf = d => Math.floor((parse(key(d)) - startSun())/(7*864e5))+1;
const clampW = w => Math.max(1,Math.min(12,w));
function phaseOf(w){ if(w<=4) return {n:1,name:"Adaptación"}; if(w<=8) return {n:2,name:"Volumen"}; return {n:3,name:"Intensidad"}; }
const isDeload = w => w===4||w===8;
function setsFor(base,w){let s=base; if(w<=4) s=Math.min(s,3); if(isDeload(w)) s=Math.ceil(s/2); return s;}
const m4 = d => !!(S.m4||{})[weekOf(d)];
function sessCode(d){const dow=d.getDay(); if(dow===4&&m4(d)) return null; return DAYSESS[dow];}
function runForD(d){
  const dow=d.getDay(), w=clampW(weekOf(d));
  if(m4(d)){ if(dow===4) return null;
    if(dow===0){const s=thuRun(w); return {title:s.length>1?"Series cortas":"Carrera corta",sub:"Semana de 4 días: al final de la sesión de piernas.",segs:s};} }
  return runFor(dow,w);
}
function tasksFor(d){const t=[]; if(sessCode(d)) t.push("e"); if(runForD(d)) t.push("r"); return t;}
const L = k => S.log[k] || {};
function dayStatus(d){
  const k=key(d), t=tasksFor(d), l=L(k);
  if(d < parse(S.start)) return "out";
  if(!t.length) return d<=TODAY ? "rest" : "future";
  if(t.every(x=>l[x])) return "done";
  if(d<TODAY) return "miss";
  return d.getTime()===TODAY.getTime() ? "pending" : "future";
}
function streak(){
  let n=0, d=new Date(TODAY);
  if(dayStatus(d)==="pending") d=addD(d,-1);
  const st=parse(S.start);
  while(d>=st){const s=dayStatus(d); if(s==="done"||s==="rest"){n++; d=addD(d,-1);} else break;}
  return n;
}
/* Repeticiones */
const repsOf = (l,id) => ((l.reps||{})[id]||[]);
const doneSets = (l,id) => repsOf(l,id).filter(v=>v!=null).length;
const maxOf = r => /máx/.test(r) ? null : +((r.match(/\d+/g)||[]).pop()||0) || null;
const minOf = r => +((r.match(/\d+/g)||[1])[0]);
const unitOf = r => / s\b/.test(r) ? "s" : "reps";
function lastFor(id, beforeKey){
  const ks=Object.keys(S.log).filter(k=>k<beforeKey).sort().reverse();
  for(const k of ks){const v=repsOf(S.log[k],id).filter(x=>x!=null); if(!v.length) continue;
    const d=parse(k), it=getSess(sessCode(d)||DAYSESS[d.getDay()]).find(x=>x[0]===id);
    return {k,vals:v,reps:it?it[2]:"",n:it?setsFor(it[1],clampW(weekOf(d))):v.length};}
  return null;
}
function readyUp(id,k){const L0=lastFor(id,k); if(!L0) return null; const mx=maxOf(L0.reps); if(!mx) return null;
  return L0.vals.length>=L0.n && L0.vals.every(v=>v>=mx) ? {mx,last:L0} : null;}

async function save(){
  S.updated=Date.now(); const s=streak(); if(s>(S.best||0)) S.best=s;

  saving=true;

}

let hapLabel=null;
function hap(n){

  try{ if(!hapLabel){hapLabel=document.createElement("label");hapLabel.setAttribute("aria-hidden","true");hapLabel.style.cssText="position:fixed;left:-200px;top:0;opacity:0;pointer-events:none";hapLabel.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hapLabel);}

}
function confetti(){
  if(RED) return;
  const c=document.createElement("canvas"); c.className="fx"; document.body.appendChild(c);
  const dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), cols=["--ej","--run","--food","--streak"].map(v=>cs.getPropertyValue(v).trim()||"#fff");
  const ps=Array.from({length:110},(_,i)=>({x:W/2+(Math.random()-.5)*60,y:H*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,r:Math.random()*360,vr:(Math.random()-.5)*14,s:6+Math.random()*6,c:cols[i%4]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-t/120);x.translate(p.x,p.y);x.rotate(p.r*Math.PI/180);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<120) requestAnimationFrame(f); else c.remove();})();
}
let toastT;

// Deslizar hacia abajo para cerrar
function bindDrag(){
  const sh=$("#sheet"), sc=$("#scrim"); let y0=null,dy=0,t0=0,active=false;
  const start=(y,force)=>{ if(!force && sh.scrollTop>0) return; y0=y; dy=0; t0=performance.now(); active=false; };
  const move=(y,e)=>{ if(y0==null) return; dy=y-y0; if(!active){ if(dy>6){active=true; sh.classList.add("drag");} else if(dy<-4){y0=null;return;} else return; }
    if(e&&e.cancelable) e.preventDefault(); sh.style.transform=`translateY(${Math.max(0,dy)}px)`; sc.style.opacity=String(Math.max(0,1-dy/400)); };
  const end=()=>{ if(y0==null) return; const v=dy/Math.max(1,performance.now()-t0); sh.classList.remove("drag");
    if(active && (dy>120||v>.6)) closeSheet(); else {sh.style.transform=""; sc.style.opacity="";} y0=null; active=false; };
  sh.ontouchstart=e=>start(e.touches[0].clientY, !!e.target.closest(".grabzone"));
  sh.ontouchmove=e=>move(e.touches[0].clientY,e);
  sh.ontouchend=end; sh.ontouchcancel=end;
  const gz=sh.querySelector(".grabzone");
  if(gz) gz.onpointerdown=e=>{ if(e.pointerType==="touch") return; start(e.clientY,true); const mv=ev=>move(ev.clientY); const up=()=>{end();removeEventListener("pointermove",mv);removeEventListener("pointerup",up);}; addEventListener("pointermove",mv); addEventListener("pointerup",up); };
}

function greet(){const h=new Date().getHours(); const g=h<6?"Buenas noches":h<14?"Buenos días":h<21?"Buenas tardes":"Buenas noches"; return g+(S.name?", "+S.name:"");}

/* Audio y voz */
let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A();} if(actx&&actx.state==="suspended") actx.resume();}catch(e){}}
function beep(f,d){try{if(!actx) return; const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d+.02);}catch(e){}}
function say(t){try{if(!S.voice||!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="es-ES"; u.rate=1.02; speechSynthesis.speak(u);}catch(e){}}
function openRun(){
  const d=parse(ui.sel), r=runForD(d); if(!r) return;
  const segs=r.test?null:r.segs, total=segs?segs.reduce((a,s)=>a+s.t*60,0):0;
  let state="ready", t0=0, acc=0, tm=null, lastIdx=-1, wake=null;
  const elapsed=()=>acc+(state==="run"?(Date.now()-t0)/1000:0);
  const segAt=e=>{let c=0; for(let i=0;i<segs.length;i++){c+=segs[i].t*60; if(e<c) return {i,left:c-e};} return {i:segs.length,left:0};};
  openSheet(`<div><div class="eyebrow">${DNAME[d.getDay()]} · Semana ${clampW(weekOf(d))}</div><h2>${esc(r.title)}</h2></div>
    <div class="card runtimer"><div class="ph2" id="rph">${r.test?"Cronómetro":"Preparado"}</div><div class="clock" id="rclock">${r.test?"0:00":fmtT(total)}</div><div class="eyebrow" id="rsub">${r.test?"5 km al máximo ritmo":"Tiempo restante"}</div>
    ${segs?`<div class="segbar" style="width:100%">${segs.map((s,i)=>`<div class="seg-${s.k}" data-sg="${i}" style="flex:${s.t};opacity:.45"></div>`).join("")}</div>`:""}</div>
    <div class="row2"><button class="cta" id="rgo" style="flex:1">Empezar</button></div>
    <div class="switch"><span>Avisos por voz</span><button class="tg ${S.voice?"on":""}" id="rvoice" role="switch" aria-checked="${!!S.voice}" aria-label="Avisos por voz"></button></div>
    <div class="row2"><button class="btn" id="rfin">Terminar y marcar hecha</button><button class="btn" id="closeS">Cerrar</button></div>`);
  const ui2=()=>{const e=elapsed();
    if(!segs){$("#rclock").textContent=fmtT(Math.floor(e));return;}
    const s=segAt(e);
    if(s.i>=segs.length){ $("#rclock").textContent="0:00"; $("#rph").textContent="¡Terminado!"; finish(true); return; }
    $("#rclock").textContent=fmtT(Math.ceil(total-e)); $("#rph").textContent=PNAME[segs[s.i].k]+" · "+fmtT(Math.ceil(s.left));
    $("#rsub").textContent=`Tramo ${s.i+1} de ${segs.length} · ritmo ${fmtPace(PACE[segs[s.i].k])} /km`;
    $$("[data-sg]").forEach(x=>x.style.opacity=+x.dataset.sg<s.i?"1":+x.dataset.sg===s.i?"1":".45");
    if(s.i!==lastIdx){ if(lastIdx>=0||state==="run"){hap(2); beep(segs[s.i].k==="rapido"?988:660,.25); say(`${PNAME[segs[s.i].k]}. ${segs[s.i].t} ${segs[s.i].t===1?"minuto":"minutos"}`);} lastIdx=s.i; }
  };
  async function lock(){try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); }catch(e){}}
  function finish(auto){ if(state==="done") return; state="done"; clearInterval(tm); try{wake&&wake.release();}catch(e){}
    if(auto) say("Carrera completada. Buen trabajo.");
    mutate(()=>{const l=(S.log[ui.sel]=S.log[ui.sel]||{}); l.r=1;}); closeSheet(); }
  $("#rgo").onclick=()=>{unlockAudio(); hap();
    if(state==="run"){acc=elapsed(); state="pause"; clearInterval(tm); $("#rgo").textContent="Seguir"; return;}

    state="run"; t0=Date.now(); $("#rgo").textContent="Pausa"; lock(); tm=setInterval(ui2,250); ui2();};
  $("#rvoice").onclick=()=>{S.voice=!S.voice; save(); $("#rvoice").classList.toggle("on",S.voice);};
  $("#rfin").onclick=()=>finish(false);
  $("#closeS").onclick=closeSheet;
  onSheetClose(()=>{clearInterval(tm); try{wake&&wake.release();}catch(e){} try{speechSynthesis.cancel();}catch(e){}});
  const vis=()=>{ if(document.visibilityState==="visible"&&state==="run") lock(); }; document.addEventListener("visibilitychange",vis); onSheetClose(()=>document.removeEventListener("visibilitychange",vis));
}

function measList(){return Object.entries(S.meas||{}).map(([k,v])=>({k,d:parse(k),kg:v.kg,cm:v.cm})).sort((a,b)=>a.k<b.k?-1:1);}
function dietAdvice(){
  const m=measList().filter(x=>x.kg!=null);
  if(m.length<2) return {state:"wait",txt:`Necesitas al menos 2 semanas de pesajes. Llevas ${m.length}.`};
  const last=m[m.length-1], prev=[...m].reverse().find(x=>(last.d-x.d)/864e5>=13);
  if(!prev) return {state:"wait",txt:"Aún no hay 2 semanas entre tu primer pesaje y el último."};
  const wk=(last.d-prev.d)/(7*864e5), rate=(prev.kg-last.kg)/wk, cmDown=last.cm!=null&&prev.cm!=null&&last.cm<prev.cm;
  const r=dec(rate.toFixed(2)), already=(S.adj||[]).some(a=>a.from===last.k);
  let o;
  if(rate>0.7) o={state:"adj",kcal:200,txt:`Bajas ${r} kg/semana: demasiado rápido, pierdes músculo.`,act:"Añade 50 g de arroz al día (+200 kcal)."};
  else if(rate>0.5) o={state:"ok",txt:`Bajas ${r} kg/semana: algo rápido pero aceptable. Seguimos igual y vigilamos el próximo lunes.`};
  else if(rate>=0.25) o={state:"ok",txt:`Bajas ${r} kg/semana: ritmo ideal. Seguimos igual.`};
  else if(rate<=0 && !cmDown) o={state:"adj",kcal:-150,txt:`No bajas ni peso ni cintura (${r} kg/semana).`,act:"Quita la crema de cacahuete y 20 g de avena (−150 kcal)."};
  else o={state:"ok",txt:cmDown?`Bajas ${r} kg/semana pero la cintura baja: estás ganando músculo. Seguimos igual.`:`Bajas ${r} kg/semana. Ritmo aceptable: seguimos igual.`};
  o.from=last.k; o.already=already; return o;
}
function chart(points,unit){
  if(!points.length) return `<div class="chart"><div class="empty">Aún no hay datos. Apunta tu primer pesaje arriba.</div></div>`;
  const W=340,H=150,pl=38,pr=34,pt=14,pb=24;
  const xs=points.map(p=>p.d.getTime()), ys=points.map(p=>p.v);
  let y0=Math.min(...ys), y1=Math.max(...ys); const padY=Math.max(0.5,(y1-y0)*0.25); y0=Math.floor(y0-padY); y1=Math.ceil(y1+padY);
  const x0=Math.min(...xs), x1=Math.max(...xs)===x0?x0+7*864e5:Math.max(...xs);
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const fmt=v=>dec(Math.round(v*10)/10);
  let g=[y0,(y0+y1)/2,y1].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t)}</text>`).join("");
  const first=points[0], last=points[points.length-1];
  g+=`<text x="${X(first.d.getTime())}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${points.length>1?"start":"middle"}">${fdate(first.d)}</text>`;
  if(points.length>1) g+=`<text x="${X(last.d.getTime())}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fdate(last.d)}</text>`;
  const path=points.map((p,i)=>(i?"L":"M")+X(p.d.getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=points.length>1?`<path d="${path} L${X(last.d.getTime()).toFixed(1)} ${H-pb} L${X(first.d.getTime()).toFixed(1)} ${H-pb} Z" fill="var(--acc)" opacity=".12"/>`:"";
  const dots=points.map(p=>`<circle cx="${X(p.d.getTime())}" cy="${Y(p.v)}" r="4" fill="var(--acc)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const lbl=`<text x="${X(last.d.getTime())+8}" y="${Y(last.v)+4}" font-size="12" font-weight="700" fill="var(--fg)">${fmt(last.v)}</text>`;
  const data=esc(JSON.stringify(points.map(p=>[X(p.d.getTime()),Y(p.v),`${fdate(p.d)} · ${fmt(p.v)} ${unit}`])));
  return `<div class="chart" data-pts="${data}" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${unit}">${g}${area}<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lbl}</svg><div class="tip" hidden></div></div>`;
}
function weekSummary(d){
  const ws=addD(d,-d.getDay()); let e=[0,0],r=[0,0],m=0,ok=0,reps=0,km=0,av=0; const days=[];
  for(let i=0;i<7;i++){const x=addD(ws,i),k=key(x),l=L(k),t=tasksFor(x);
    if(t.includes("e")){e[1]++; if(l.e) e[0]++;} if(t.includes("r")){r[1]++; if(l.r){r[0]++; km+=runStats(runForD(x)).kmN;}}
    m+=(l.m||[]).filter(Boolean).length; const st=dayStatus(x); if(st==="done"||(st==="rest"&&x<=TODAY)) ok++; if(st!=="out"&&st!=="future") av++; days.push(st);
    Object.values(l.reps||{}).forEach(a=>a.forEach(v=>{if(v!=null) reps+=v;}));}
  return {e,r,m,ok,reps,km,days,ws,av:Math.max(1,av),any:e[0]+r[0]+m>0};
}

/* ---------- Resumen semanal ---------- */
function verdict(sm){
  const p=sm.ok/sm.av;
  if(p>=1) return "Semana perfecta. Así se construye el cambio.";
  if(p>=.85) return "Gran semana. Solo un detalle te separa de la perfecta.";
  if(p>=.6) return "Buena base. La próxima, a por un día más.";
  if(p>0) return "Semana irregular. Empieza la próxima con el primer entreno, aunque sea corto.";
  return sm.any?"Semana en marcha. Completa los días enteros para sumar racha.":"Semana sin registros. Mañana es el mejor día para volver.";
}
function openRecap(ws){
  const sm=weekSummary(ws), w=weekOf(ws);
  const best=[]; const seen=new Set();
  for(let i=0;i<7;i++){const k=key(addD(ws,i)), l=L(k); Object.entries(l.reps||{}).forEach(([id,v])=>{ if(seen.has(id)) return; const cur=v.filter(x=>x!=null); if(!cur.length) return; const prev=lastFor(id,key(ws)); if(prev){const a=Math.max(...prev.vals), b=Math.max(...cur); if(b>a){best.push(`${(EX[id]||{n:id}).n}: ${a} → ${b}`); seen.add(id);}}});}
  openSheet(`<div class="recap"><div><div class="eyebrow">Resumen · semana ${clampW(w)} · ${fdate(ws)} – ${fdate(addD(ws,6))}</div><h2>Tu semana</h2></div>
    <div class="score">${Math.round(sm.ok/sm.av*100)} %</div>
    <p style="margin:0;font-size:17px;font-weight:600">${verdict(sm)}</p>
    <div class="dayrow">${sm.days.map((s,i)=>`<div><i class="${s}">${s==="done"?CHECK:""}</i>${DL[i]}</div>`).join("")}</div>
    <div class="grid4"><div class="kpi"><span class="v">${sm.e[0]}<small>/${sm.e[1]}</small></span><span class="k">Entrenos</span></div><div class="kpi"><span class="v">${dec(sm.km.toFixed(1))}<small>km</small></span><span class="k">Corridos (aprox.)</span></div>
    <div class="kpi"><span class="v">${sm.m}<small>/28</small></span><span class="k">Comidas del plan</span></div><div class="kpi"><span class="v">${miles(sm.reps)}</span><span class="k">Repeticiones</span></div></div>
    ${best.length?`<div class="banner g"><b>Récords de la semana</b>${best.map(esc).join(" · ")}</div>`:""}
    <div class="note">Racha actual: <b>${streak()} días</b>. Mejor racha: <b>${Math.max(S.best||0,streak())} días</b>.</div>
    <button class="cta" id="closeS">Seguir</button></div>`);
  $("#closeS").onclick=closeSheet;
}
function maybeRecap(){
  if(!S.onboarded) return;
  const tw=weekOf(TODAY), pw=tw-1; if(pw<1||pw>12) return;
  S.recap=S.recap||{}; if(S.recap[pw]) return;

}

  }
  if(page.startsWith("sess:")){
    const c=page.slice(5), items=getSess(c);
    const opts=id=>Object.keys(EX).map(k=>`<option value="${k}" ${k===id?"selected":""}>${esc(EX[k].n)}</option>`).join("");
    const rests=[30,45,60,90,120,180];
    h=`${adminHead("Sesión "+c,"plan")}
    <div class="list">${items.map((it,i)=>`<div class="edrow"><select data-ed="${i}" data-f="0" aria-label="Ejercicio ${i+1}">${opts(it[0])}</select>
      <div class="r3"><input data-ed="${i}" data-f="1" type="number" min="1" max="8" inputmode="numeric" value="${it[1]}" aria-label="Series"><input data-ed="${i}" data-f="2" value="${esc(it[2])}" aria-label="Repeticiones"><select data-ed="${i}" data-f="3" aria-label="Descanso">${rests.map(r=>`<option value="${r}" ${r===it[3]?"selected":""}>${r>=120?r/60+" min":r+" s"}</option>`).join("")}</select></div>
      <div class="acts"><button data-mv="${i}:-1" aria-label="Subir">↑</button><button data-mv="${i}:1" aria-label="Bajar">↓</button><button data-del="${i}" aria-label="Quitar">✕</button></div></div>`).join("")}</div>
    <p class="sync" style="display:block">Series · repeticiones (texto libre, p. ej. «8-12» o «30 s») · descanso. En las semanas 1-4 y de descarga la app ajusta las series sola.</p>
    <div class="row2"><button class="btn p" id="edAdd">Añadir ejercicio</button>${S.plan.sess[c]?'<button class="btn danger" id="edReset">Restaurar original</button>':""}</div>`;
    ui.edCode=c;
  }
  if(page==="menu"){
    h=`${adminHead("Menú semanal","home")}
    <p style="margin:0;color:var(--muted)">Elige el plato de cada comida. Las recetas y las cantidades se ajustan solas.</p>
    ${[1,2,3,4,5,6,0].map(dw=>{const M=getMenu(dw); return `<div class="card" style="gap:8px"><b style="font-family:var(--display);font-size:18px;text-transform:uppercase">${DNAME[dw]}</b>${MEALS.map(([s,,lab])=>`<div class="field"><label>${lab}</label><select class="inp" data-mn="${dw}:${s}">${SLOT_OPTS[s].map(k=>`<option value="${k}" ${k===M[s]?"selected":""}>${esc(R[k].n)}</option>`).join("")}</select></div>`).join("")}</div>`;}).join("")}
    ${Object.keys(S.plan.menu||{}).length?'<button class="btn danger" id="mnReset">Restaurar menú original</button>':""}`;
  }
  if(page==="data"){
    h=`${adminHead("Copia de seguridad","home")}
    <div class="note">Tus datos se guardan en este dispositivo${dbRef?" y en tu cuenta de Claude":""}. Haz una copia de vez en cuando: si borras Safari o cambias de móvil, la necesitarás.</div>
    <div class="menu">
      <button id="exp"><span class="ic">⬆️</span><span><div class="t">Exportar copia</div><div class="d">Guárdala en Archivos o envíatela</div></span>${CHEV}</button>
      <button id="impBtn"><span class="ic">⬇️</span><span><div class="t">Importar copia</div><div class="d">Desde un archivo .json</div></span>${CHEV}</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <div id="expBox"></div>
    <button class="btn danger" id="wipe">Borrar todo el progreso</button>`;
  }
  if(page==="install"){
    h=`${adminHead("Instalar","home")}
    ${standalone()?`<div class="banner g"><b>Ya está instalada</b>La estás usando como app. Funciona sin conexión.</div>`:`
    <ol class="how" style="font-size:16px">
      <li>Abre esta página en <b>Safari</b>.</li>
      <li>Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li>
      <li>Elige <b>«Añadir a pantalla de inicio»</b> y pulsa <b>Añadir</b>.</li>
    </ol>
    <div class="note">Se abrirá a pantalla completa, con su icono y su pantalla de carga, y funcionará sin internet en el parque.</div>`}`;
  }
  if(page==="about"){
    h=`${adminHead("Acerca de","home")}
    <div style="width:84px;height:84px;border-radius:22px;overflow:hidden">${LOGO}</div>
    <div><div style="font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase">Cambio Físico</div><div class="sync">Versión ${VERSION} · hecha a medida</div></div>
    <p style="margin:0;color:var(--muted)">Plan de 12 semanas: 5 entrenos, 4 carreras y 4 comidas al día. Los tres colores del logo son tus tres pilares: ejercicio, running y alimentación, subiendo.</p>
    <div class="note">Ilustraciones animadas propias. Fuentes Barlow Condensed e Inter (licencia libre). Sin anuncios, sin cuentas, sin rastreo. Coste: 0 €.</div>`;
  }
  openSheet(h);
  $$("[data-go]").forEach(b=>b.onclick=()=>{hap();openAdmin(b.dataset.go);});
  $$("[data-back]").forEach(b=>b.onclick=()=>openAdmin(b.dataset.back));
  bindAdmin(page);
}
function bindAdmin(page){
  const ro=$("#redoOb"); if(ro) ro.onclick=()=>{closeSheet(); showOnboarding(0);};
  if(page==="profile") $("#pSave").onclick=()=>{S.name=$("#pName").value.trim().slice(0,30); const v=$("#pStart").value; if(v){S.start=v; ui.sel=key(TODAY);} save(); toast("Perfil guardado"); openAdmin("home");};
  if(page.startsWith("sess:")){
    const c=ui.edCode, cur=()=>JSON.parse(JSON.stringify(getSess(c))), put=a=>{S.plan.sess=Object.assign({},S.plan.sess,{[c]:a}); save();};
    $$("[data-ed]").forEach(el=>el.onchange=()=>{const a=cur(), i=+el.dataset.ed, f=+el.dataset.f; let v=el.value;
      if(f===1) v=Math.max(1,Math.min(8,parseInt(v)||1)); if(f===3) v=+v; if(f===2) v=v.trim()||"10";
      a[i][f]=v; put(a); if(f===0) openAdmin(page);});
    $$("[data-mv]").forEach(b=>b.onclick=()=>{const [i,dl]=b.dataset.mv.split(":").map(Number), a=cur(), j=i+dl; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; put(a); openAdmin(page);});
    $$("[data-del]").forEach(b=>b.onclick=()=>{const a=cur(); if(a.length<=1){toast("La sesión necesita al menos un ejercicio");return;} a.splice(+b.dataset.del,1); put(a); openAdmin(page);});
    $("#edAdd").onclick=()=>{const a=cur(); a.push(["plancha",3,"30 s",45]); put(a); openAdmin(page);};
    const rs=$("#edReset"); if(rs) rs.onclick=()=>{const o=Object.assign({},S.plan.sess); delete o[c]; S.plan.sess=o; save(); toast("Sesión restaurada"); openAdmin(page);};
  }
  if(page==="menu"){
    $$("[data-mn]").forEach(el=>el.onchange=()=>{const [dw,s]=el.dataset.mn.split(":"); const m=Object.assign({},S.plan.menu); m[dw]=Object.assign({},m[dw],{[s]:el.value}); S.plan.menu=m; save(); toast("Menú actualizado");});
    const rs=$("#mnReset"); if(rs) rs.onclick=()=>{S.plan.menu={}; save(); toast("Menú restaurado"); openAdmin("menu");};
  }
  if(page==="data"){
    $("#exp").onclick=exportData;
    $("#impBtn").onclick=()=>$("#impFile").click();
    $("#impFile").onchange=e=>{const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>importText(String(rd.result)); rd.readAsText(f);};
    $("#wipe").onclick=function(){ if(this.dataset.c){const st=S.start,nm=S.name;S=DEF();S.start=st;S.name=nm;S.onboarded=true;save();closeSheet();toast("Progreso borrado");} else {this.dataset.c=1;this.textContent="Pulsa otra vez para borrar todo";} };
  }
}
function exportData(){
  const json=JSON.stringify(S), name=`cambio-fisico-${key(TODAY)}.json`;
  const fallbackText=()=>{ $("#expBox").innerHTML=`<div class="field"><label for="expTxt">Copia este texto y guárdalo en Notas</label><textarea id="expTxt" readonly>${esc(json)}</textarea></div><div class="row2"><button class="btn p" id="cpy">Copiar</button></div><div class="field"><label for="impTxt">O pega aquí una copia para importarla</label><textarea id="impTxt"></textarea></div><button class="btn" id="impGo">Importar texto</button>`;
    $("#cpy").onclick=()=>{navigator.clipboard.writeText(json).then(()=>toast("Copiado")).catch(()=>{$("#expTxt").select();toast("Selecciona y copia el texto");});};
    $("#impGo").onclick=()=>importText($("#impTxt").value); };
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file],title:"Copia de Cambio Físico"}).then(()=>toast("Copia exportada")).catch(e=>{ if(e&&e.name!=="AbortError") fallbackText(); }); return; }
  }catch(e){}
  if(window.PWA){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Copia descargada"); return; }
  fallbackText();
}
function importText(txt){
  try{ const o=JSON.parse(txt); if(!o||typeof o!=="object"||!o.log) throw 0;
    const prev=JSON.stringify(S); S=migrate(o); S.onboarded=true; save(); closeSheet(); render();
    toast("Copia importada",{label:"Deshacer",fn:()=>{S=migrate(JSON.parse(prev));save();render();}});
  }catch(e){ toast("Ese archivo no es una copia válida"); }
}

/* =================== BIENVENIDA =================== */
let obStep=0, obData={};
function showOnboarding(step){
  obStep=step||0; obData={name:S.name||"",start:S.start,kg:"",cm:"",flex:"",dom:"",plank:""};
  const ob=$("#ob"); ob.hidden=false; drawOb();
}
function drawOb(){
  const ob=$("#ob"), N=5, dots=`<div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i===obStep?"on":""}"></i>`).join("")}</div>`;
  let h="";
  if(obStep===0) h=`<div class="logo">${LOGO}</div><h1>Cambio<br>físico</h1><p>Tu plan de 12 semanas en el bolsillo. Cada día sabrás qué entrenar, cuánto correr y qué comer.</p>
    <div class="pillars"><div><i style="background:var(--ej)"></i><b>Ejercicio</b><span>5 sesiones, ilustradas</span></div><div><i style="background:var(--run)"></i><b>Running</b><span>Carreras guiadas por voz</span></div><div><i style="background:var(--food)"></i><b>Comida</b><span>Recetas al gramo</span></div></div>
    <button class="cta" id="obNext" style="--acc:var(--ej)">Empezar</button>`;
  if(obStep===1) h=`<h1>Hola</h1><p>Dos datos para personalizarla.</p>
    <div class="field"><label for="obName">¿Cómo te llamas?</label><input id="obName" value="${esc(obData.name)}" autocomplete="given-name" placeholder="Tu nombre"></div>
    <div class="field"><label for="obStart">¿Qué día empiezas el plan?</label><input type="date" id="obStart" value="${obData.start}"></div>
    <button class="cta" id="obNext">Continuar</button>`;
  if(obStep===2) h=`<h1>Punto de partida</h1><p>Mañana en ayunas es el mejor momento. Puedes dejarlo para luego.</p>
    <div class="form2"><div class="field"><label for="obKg">Peso (kg)</label><input id="obKg" inputmode="decimal" placeholder="73,0" value="${esc(obData.kg)}"></div><div class="field"><label for="obCm">Cintura (cm)</label><input id="obCm" inputmode="decimal" placeholder="80,0" value="${esc(obData.cm)}"></div></div>
    <button class="cta" id="obNext">Continuar</button><button class="btn" id="obSkip">Lo haré luego</button>`;
  if(obStep===3) h=`<h1>Tests de la semana 1</h1><p>Tu marca de hoy. En la semana 12 los repites y verás cuánto has mejorado.</p>
    <div class="field"><label for="obFlex">Flexiones máximas seguidas</label><input id="obFlex" inputmode="numeric" placeholder="12" value="${esc(obData.flex)}"></div>
    <div class="form2"><div class="field"><label for="obDom">Dominadas máximas</label><input id="obDom" inputmode="numeric" placeholder="2" value="${esc(obData.dom)}"></div><div class="field"><label for="obPlank">Plancha (segundos)</label><input id="obPlank" inputmode="numeric" placeholder="45" value="${esc(obData.plank)}"></div></div>
    <button class="cta" id="obNext">Continuar</button><button class="btn" id="obSkip">Lo haré luego</button>`;
  if(obStep===4) h=`<h1>Todo listo${obData.name?", "+esc(obData.name):""}</h1>
    ${standalone()?`<p>La app está instalada y funciona sin conexión.</p>`:`<p>Para tenerla como una app de verdad:</p><ol class="how" style="font-size:16px"><li>Abre esta página en <b>Safari</b>.</li><li>Pulsa <b>Compartir</b>.</li><li>Elige <b>«Añadir a pantalla de inicio»</b>.</li></ol>`}
    <div class="note"><b>Cómo funciona la racha:</b> un día cuenta si completas lo que toca (entreno y carrera). Viernes y sábado de descanso no la rompen.</div>
    <button class="cta" id="obNext">Ir a hoy</button>`;
  ob.innerHTML=`<div class="in">${dots}${h}${obStep>0&&obStep<4?'<button class="btn" id="obBack">Atrás</button>':""}</div>`;
  const keep=()=>{ const g=id=>{const e=$("#"+id); return e?e.value:null;};
    if(obStep===1){obData.name=g("obName")||""; obData.start=g("obStart")||obData.start;}
    if(obStep===2){obData.kg=g("obKg"); obData.cm=g("obCm");}
    if(obStep===3){obData.flex=g("obFlex"); obData.dom=g("obDom"); obData.plank=g("obPlank");} };
  $("#obNext").onclick=()=>{hap(); keep(); if(obStep<4){obStep++; drawOb(); ob.scrollTop=0;} else finishOb();};
  const sk=$("#obSkip"); if(sk) sk.onclick=()=>{ if(obStep===2){obData.kg="";obData.cm="";} else {obData.flex=obData.dom=obData.plank="";} obStep++; drawOb(); };
  const bk=$("#obBack"); if(bk) bk.onclick=()=>{keep(); obStep--; drawOb();};
}
function finishOb(){
  S.name=(obData.name||"").trim().slice(0,30);
  if(obData.start) S.start=obData.start;
  const kg=num(obData.kg), cm=num(obData.cm);
  if(kg!=null||cm!=null){ S.meas=Object.assign({},S.meas,{[S.start]:{kg,cm}}); S.tests.w1=Object.assign({},S.tests.w1); if(kg!=null) S.tests.w1.peso=kg; if(cm!=null) S.tests.w1.cint=cm; }
  [["flex","flex"],["dom","dom"],["plank","plank"]].forEach(([a,b])=>{const v=num(obData[a]); if(v!=null) S.tests.w1[b]=v;});
  S.onboarded=true; ui.sel=key(TODAY); save();
  const ob=$("#ob"); ob.style.transition="opacity .35s"; ob.style.opacity="0"; setTimeout(()=>{ob.hidden=true;ob.style.opacity="";},350);
  render(); setTimeout(()=>{confetti(); toast(S.name?`¡A por ello, ${S.name}!`:"¡A por ello!");},250);
}
function maybeOnboard(){ if(!S.onboarded && $("#ob").hidden) showOnboarding(0); }

/* =================== EVENTOS =================== */
function bindMain(){
  const ens=()=> (S.log[ui.sel]=S.log[ui.sel]||{});
  const de=$("#doneE"); if(de) de.onclick=()=>{hap(); mutate(()=>{const l=ens(); l.e=l.e?0:1;}); render();};
  const dr=$("#doneR"); if(dr) dr.onclick=()=>{hap(); mutate(()=>{const l=ens(); l.r=l.r?0:1;}); render();};
  const gr=$("#goRun"); if(gr) gr.onclick=()=>{hap(); unlockAudio(); openRun();};
  $$(".ex").forEach(b=>b.onclick=()=>{hap(); openEx(+b.dataset.i);});
  $$("[data-open]").forEach(b=>b.onclick=()=>{const i=b.dataset.open; ui.open[i]=!ui.open[i]; render();});
  $$("[data-two]").forEach(b=>b.onclick=()=>{ui.two=b.dataset.two==="1"; render();});
  $$("[data-meal]").forEach(b=>b.onclick=()=>{hap(); mutate(()=>{const l=ens(); l.m=(l.m||[0,0,0,0]).slice(); const i=+b.dataset.meal; l.m[i]=l.m[i]?0:1; if(l.m.every(Boolean)) setTimeout(()=>toast("4 de 4 comidas: día de dieta perfecto 🥗"),50);}); render();});
  const os=$("#openShop"); if(os) os.onclick=()=>{hap(); openShop();};
  if(ui.tab==="prog") bindProg();
}
$$("nav.tabs button").forEach(b=>b.onclick=()=>{if(ui.tab===b.dataset.t){window.scrollTo({top:0,behavior:"smooth"});return;} hap(); ui.tab=b.dataset.t; try{localStorage.setItem(LSK+"-tab",ui.tab);}catch(e){} render(); window.scrollTo(0,0);});
$("#prevW").onclick=()=>{hap(); ui.sel=key(addD(parse(ui.sel),-7));render();};
$("#nextW").onclick=()=>{hap(); ui.sel=key(addD(parse(ui.sel),7));render();};
$("#openAdmin").onclick=()=>{hap(); openAdmin("home");};
$("#streak").onclick=()=>{hap(); toast(`Racha: ${streak()} días · mejor: ${Math.max(S.best||0,streak())}`);};
// Al volver a la app otro día, refresca "hoy"
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ const t=key(today()); if(t!==key(TODAY)){ if(ui.sel===key(TODAY)) ui.sel=t; render(); maybeRecap(); } } });

/* =================== PWA =================== */
if(window.PWA && "serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const nw=reg.installing; nw&&nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) toast("Nueva versión disponible",{label:"Actualizar",fn:()=>nw.postMessage("skip")}); });});
  }).catch(()=>{});
  let reloaded=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!reloaded){reloaded=true; location.reload();} });
}

render();
maybeOnboard();
maybeRecap();
</script>
